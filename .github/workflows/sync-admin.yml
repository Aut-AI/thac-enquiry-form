name: Sync admin/ to thac-admin

# admin/ here is developed in this monorepo, but the live CRM at
# ciaran-aut-ai.github.io/thac-admin is served by GitHub Pages from a
# *separate* repo (Ciaran-aut-ai/thac-admin), which used to be kept in
# sync by hand ("... (sync)" commits) until that stopped on 2026-06-30 --
# 33+ commits' worth of admin/ changes since then never reached the live
# site. This mirrors the Pages-served files (*.html, css/, js/) into that
# repo on every push to main so that gap can't reopen.
#
# Deliberately NOT synced:
#   - .github/            target repo owns its own workflows
#   - supabase/           functions already deploy straight from this repo
#                         (see deploy-functions.yml); mirroring them here
#                         too would double-trigger the target's own
#                         (older, incomplete) copy of that workflow
#   - thac-github-actions/  vestigial leftover, not served by Pages
#
# Requires a THAC_ADMIN_SYNC_TOKEN repo secret: a token with contents:write
# on Ciaran-aut-ai/thac-admin (this repo's own GITHUB_TOKEN has no access
# to that repo). See README for how to generate/set it.

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '!admin/supabase/**'
      - '!admin/thac-github-actions/**'
      - '!admin/.github/**'
      - '.github/workflows/sync-admin.yml'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (thac-enquiry-form)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target (thac-admin)
        uses: actions/checkout@v4
        with:
          repository: Ciaran-aut-ai/thac-admin
          token: ${{ secrets.THAC_ADMIN_SYNC_TOKEN }}
          path: target

      - name: Mirror Pages-served files into target
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='thac-github-actions' \
            source/admin/ target/

      - name: Commit and push if changed
        working-directory: target
        run: |
          git config user.name "thac-admin-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Sync from Aut-AI/thac-enquiry-form@${GITHUB_SHA:0:7}"
          git push
