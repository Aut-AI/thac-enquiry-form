<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script>
requireAuth();

let sort = { key: 'urgency', dir: 'asc' };
let dashJobs = [];
let introducerById = {};

function statsCollapsed() {
  try { return localStorage.getItem('thac_dash_stats') === 'collapsed'; } catch (e) { return false; }
}

function syncStatsToggle() {
  const btn = document.getElementById('statsToggle');
  if (!btn) return;
  const collapsed = document.getElementById('statGrid').classList.contains('stats-collapsed');
  btn.innerHTML = `${icon(collapsed ? 'chevronDown' : 'chevronUp', 14)}${collapsed ? 'Expand' : 'Shrink'}`;
  btn.setAttribute('aria-expanded', String(!collapsed));
  btn.title = collapsed ? 'Show the full stat cards' : 'Shrink the stat cards to a summary';
}

function toggleStats() {
  const collapsed = document.getElementById('statGrid').classList.toggle('stats-collapsed');
  try { localStorage.setItem('thac_dash_stats', collapsed ? 'collapsed' : 'expanded'); } catch (e) { /* storage blocked */ }
  syncStatsToggle();
}

async function init() {
  document.getElementById('app').innerHTML = `
    ${renderSidebar('dashboard')}
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">Dashboard</div>
        <div class="topbar-search" style="position:relative;">
          <span>${icon('search')}</span>
          <input type="text" placeholder="Search jobs, clients, introducers..." id="globalSearch"
            oninput="handleGlobalSearch(this.value)" autocomplete="off">
          <div id="searchResults" style="display:none;position:absolute;top:100%;left:0;right:0;
            background:white;border:1px solid var(--border);border-radius:10px;
            box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:200;max-height:360px;overflow-y:auto;margin-top:4px;">
          </div>
        </div>
        <span style="font-size:13px;color:var(--text-muted)">${new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</span>
      </div>
      <div class="page-body">

        <!-- Stat Cards (Shrink / Expand, remembered per browser) -->
        <div class="stats-bar">
          <span class="stats-title">Overview</span>
          <button type="button" class="stats-toggle" id="statsToggle" onclick="toggleStats()"></button>
        </div>
        <div class="stat-grid${statsCollapsed() ? ' stats-collapsed' : ''}" id="statGrid">
          <div class="stat-card multi">
            <div class="stat-label">Job Urgency</div>
            <div class="stat-rows">
              <div class="stat-row" onclick="window.location.href='jobs.html?urgency=red'">
                <span class="stat-row-label">${dot('urgent')}Urgent <span class="muted-sub">3 working days</span></span><span class="stat-row-count" id="statUrgent">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?urgency=orange'">
                <span class="stat-row-label">${dot('elevated')}Elevated <span class="muted-sub">5 working days</span></span><span class="stat-row-count" id="statElevated">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?urgency=yellow'">
                <span class="stat-row-label">${dot('standard')}Standard <span class="muted-sub">10 working days</span></span><span class="stat-row-count" id="statStandard">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?urgency=grey'">
                <span class="stat-row-label">${dot('low')}Low <span class="muted-sub">15+ working days</span></span><span class="stat-row-count" id="statLow">—</span></div>
            </div>
          </div>
          <div class="stat-card multi">
            <div class="stat-label">Job Stage</div>
            <div class="stat-rows">
              <div class="stat-row" data-status="red" tabindex="0" onclick="window.location.href='jobs.html?dispatch=red'">
                <span class="stat-row-label">${dot('urgent')}Unallocated</span><span class="stat-row-count" id="statUnallocated">—</span></div>
              <div class="stat-row" data-status="orange" tabindex="0" onclick="window.location.href='jobs.html?dispatch=orange'">
                <span class="stat-row-label">${dot('complete')}Allocated</span><span class="stat-row-count" id="statAllocated">—</span></div>
              <div class="stat-row" data-status="yellow" tabindex="0" onclick="window.location.href='jobs.html?dispatch=yellow'">
                <span class="stat-row-label">${dot('standard')}Survey done, awaiting data</span><span class="stat-row-count" id="statSurveyDone">—</span></div>
              <div class="stat-row" data-status="data_received" tabindex="0" onclick="window.location.href='jobs.html?dispatch=data_received'">
                <span class="stat-row-label">${dot('elevated')}Data received, report to complete</span><span class="stat-row-count" id="statDataReceived">—</span></div>
              <div class="stat-row" data-status="awaiting_client" tabindex="0" onclick="window.location.href='jobs.html?dispatch=awaiting_client'">
                <span class="stat-row-label">${icon('clock', 12)}Awaiting client</span><span class="stat-row-count" id="statAwaitingClient">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?dispatch=pending_approval'" data-status="pending_approval" tabindex="0">
                <span class="stat-row-label">${icon('clock', 12)}Awaiting go-ahead / plans</span><span class="stat-row-count" id="statOffMap">—</span></div>
            </div>
          </div>
          <div class="stat-card multi">
            <div class="stat-label">To Do</div>
            <div class="stat-rows">
              <div class="stat-row" onclick="window.location.href='jobs.html?dispatch=orange&reports=db_todo'">
                <span class="stat-row-label">${icon('alertTriangle', 12)}Database needed, surveyor waiting</span><span class="stat-row-count" id="statDbWaiting">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?reports=db_todo'">
                <span class="stat-row-label">${icon('clock', 12)}Database to create</span><span class="stat-row-count" id="statDbTodo">—</span></div>
              <div class="stat-row" onclick="window.location.href='jobs.html?reports=report_todo'">
                <span class="stat-row-label">${icon('clock', 12)}Report to draft</span><span class="stat-row-count" id="statReportTodo">—</span></div>
            </div>
            <div class="stat-sub">Active jobs that are on the map or further on</div>
          </div>
          <!-- Overdue + revenue, stacked to the height of the cards beside them -->
          <div class="stat-stack">
            <div class="stat-card compact">
              <div class="stat-label">Overdue</div>
              <div class="stat-value" id="statOverdue">—</div>
              <div class="stat-sub">Past SLA, report not yet sent (not counting jobs awaiting the client)</div>
            </div>
            <div class="stat-card compact revenue">
              <div class="stat-label">${icon('currency',13)}This Month</div>
              <div class="stat-value" id="revMonth">—</div>
              <div class="stat-sub">Invoiced in <span id="revMonthLabel"></span></div>
            </div>
            <div class="stat-card compact revenue">
              <div class="stat-label">${icon('chartBar',13)}This Year</div>
              <div class="stat-value" id="revYear">—</div>
              <div class="stat-sub">Total invoiced <span id="revYearLabel"></span></div>
            </div>
          </div>
        </div>

        <!-- Urgency Dashboard -->
        <div class="card">
          <div class="card-title">
            Active Jobs by Urgency
            <a href="jobs.html" class="btn btn-secondary btn-sm">View All Jobs</a>
          </div>
          <div id="urgencyDashboard"><div class="loading"><div class="spinner"></div><br>Loading jobs...</div></div>
        </div>
      </div>
    </div>
  `;

  syncStatsToggle();

  await Promise.all([
    loadStats(),
    loadRevenue(),
    loadUrgencyDashboard()
  ]);
}

// ============================================================
// STATS — job counts by urgency state
// ============================================================
async function loadStats() {
  const set = (id, n) => { document.getElementById(id).textContent = n; };
  try {
    const jobs = ((await dbGet('jobs', {
      'select': 'id,urgency_state,dispatch_state,surveyor_id,sla_deadline,axi_prepared,report_drafted',
      'is_archived': 'not.eq.true', 'limit': 5000,
    })) || []).filter(j => j.dispatch_state !== 'archived');
    const n = fn => jobs.filter(fn).length;

    set('statUrgent',   n(j => j.urgency_state === 'red'));
    set('statElevated', n(j => j.urgency_state === 'orange'));
    set('statStandard', n(j => j.urgency_state === 'yellow'));
    set('statLow',      n(j => j.urgency_state === 'grey'));

    set('statUnallocated',    n(j => j.dispatch_state === 'red'));
    set('statAllocated',      n(j => j.dispatch_state === 'orange'));
    set('statSurveyDone',     n(j => j.dispatch_state === 'yellow'));
    set('statDataReceived',   n(j => j.dispatch_state === 'data_received'));
    set('statAwaitingClient', n(j => j.dispatch_state === 'awaiting_client'));
    set('statOffMap',         n(j => ['pending_approval', 'waiting_for_plans'].includes(j.dispatch_state)));

    // Office to-dos only count once the job is live: a quote not yet accepted
    // or a Stage 2 still waiting for plans needs no database yet.
    const live = j => !['pending_approval', 'waiting_for_plans'].includes(j.dispatch_state);
    set('statDbWaiting',  n(j => j.dispatch_state === 'orange' && !j.axi_prepared));
    set('statDbTodo',     n(j => live(j) && !j.axi_prepared));
    set('statReportTodo', n(j => live(j) && !j.report_drafted));

    const today = new Date().toISOString().slice(0, 10);
    set('statOverdue', n(j => j.sla_deadline && j.sla_deadline < today && !['green', 'awaiting_client'].includes(j.dispatch_state)));
  } catch (e) {
    console.error('Stats error:', e);
  }
}

// ============================================================
// REVENUE SUMMARY
// ============================================================

async function loadRevenue() {
  try {
    const now   = new Date();
    const month = now.getMonth();
    const year  = now.getFullYear();

    document.getElementById('revMonthLabel').textContent =
      now.toLocaleString('en-GB', { month: 'long' });
    document.getElementById('revYearLabel').textContent = year;

    const jobs = await dbGet('jobs', {
      'select': 'invoice1_date,invoice1_amount,invoice1_paid,invoice2_date,invoice2_amount,invoice2_paid',
      'invoice1_date': 'not.is.null'
    });

    if (!jobs) return;

    let thisMonth = 0, thisYear = 0;

    jobs.forEach(j => {
      // Invoice 1
      if (j.invoice1_date) {
        const d = new Date(j.invoice1_date);
        const amt = Number(j.invoice1_amount) || 0;
        if (d.getFullYear() === year && d.getMonth() === month) thisMonth += amt;
        if (d.getFullYear() === year) thisYear += amt;
      }
      // Invoice 2
      if (j.invoice2_date) {
        const d = new Date(j.invoice2_date);
        const amt = Number(j.invoice2_amount) || 0;
        if (d.getFullYear() === year && d.getMonth() === month) thisMonth += amt;
        if (d.getFullYear() === year) thisYear += amt;
      }
    });

    const fmt = n => n > 0 ? '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : '£0';
    document.getElementById('revMonth').textContent = fmt(thisMonth);
    document.getElementById('revYear').textContent  = fmt(thisYear);
  } catch (e) {
    console.error('Revenue error:', e);
  }
}

// ============================================================
// URGENCY DASHBOARD — active jobs sorted by urgency state
// ============================================================

function jobUrgencyRowClass(state) {
  switch (state) {
    case 'red':    return 'urgency-urgent';
    case 'orange': return 'urgency-elevated';
    case 'yellow': return 'urgency-standard';
    case 'green':  return 'urgency-complete';
    default:       return 'urgency-low';
  }
}

function slaCountdown(dateStr) {
  if (!dateStr) return '<span class="muted">No SLA set</span>';
  const days = Math.ceil((new Date(dateStr) - Date.now()) / (1000 * 60 * 60 * 24));
  if (days < 0)  return `<span style="color:#dc2626;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${icon('alertTriangle',14)}${Math.abs(days)}d overdue</span>`;
  if (days === 0) return `<span style="color:#dc2626;font-weight:700;display:inline-flex;align-items:center;gap:6px;">${icon('alertTriangle',14)}Due today</span>`;
  if (days <= 1)  return `<span style="color:#dc2626;font-weight:600;display:inline-flex;align-items:center;gap:6px;">${dot('urgent')}${days}d left</span>`;
  if (days <= 3)  return `<span style="color:#ea580c;font-weight:600;display:inline-flex;align-items:center;gap:6px;">${dot('elevated')}${days}d left</span>`;
  if (days <= 5)  return `<span style="color:#ca8a04;font-weight:600;display:inline-flex;align-items:center;gap:6px;">${dot('standard')}${days}d left</span>`;
  return `<span style="color:var(--text-muted);">${days}d left</span>`;
}

async function loadUrgencyDashboard() {
  try {
    const jobs = await dbGet('jobs', {
      'select': 'id,reference,survey_type,job_type,urgency_state,dispatch_state,site_postcode,survey_date,agreed_amount,sla_deadline,surveyor_id,axi_prepared,report_drafted,report_finalised,invoice1_date,introducer_client_id,end_client_name,billing_contact_name',
      'is_archived': 'not.eq.true',
      'order': 'created_at.desc',
      'limit': 500
    });

    if (!jobs || jobs.length === 0) {
      document.getElementById('urgencyDashboard').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${icon('briefcase', 48)}</div>
          <h3>No active jobs</h3>
          <p>Jobs appear here when a quote is accepted or you add one</p>
        </div>`;
      return;
    }

    introducerById = {};
    (await loadIntroducers()).forEach(i => { introducerById[i.id] = i; });
    dashJobs = jobs;
    renderUrgencyTable();
  } catch (e) {
    document.getElementById('urgencyDashboard').innerHTML = `<div class="empty-state"><p>Error loading jobs: ${e.message}</p></div>`;
  }
}

// Database / Report drafted tickboxes, same as the jobs list.
const PROGRESS_LABELS = { axi_prepared: 'Database created', report_drafted: 'Report drafted' };

function progressTick(j, field) {
  return `<input type="checkbox" ${j[field] ? 'checked' : ''} title="${PROGRESS_LABELS[field]}"
    onchange="toggleProgress('${j.id}', '${field}', this)">`;
}

async function toggleProgress(id, field, el) {
  const job = dashJobs.find(j => j.id === id);
  const checked = el.checked;
  const atField = field === 'axi_prepared' ? 'axi_prepared_at' : 'report_drafted_at';
  try {
    await dbUpdate('jobs', `id=eq.${id}`, { [field]: checked, [atField]: checked ? new Date().toISOString() : null });
    job[field] = checked;
    showToast(`${PROGRESS_LABELS[field]}: ${checked ? 'ticked' : 'unticked'}`);
    loadStats();   // keep the To Do box in step
  } catch (e) {
    el.checked = !checked;
    showToast('Error: ' + e.message, 'error');
  }
}

function setSort(key, ev) {
  sort = nextSort(sort, key, 'asc', isAddLevel(ev));
  renderUrgencyTable();
}

function renderUrgencyTable() {
  {
    // Default view is red → orange → yellow → grey → green; any column header re-sorts it
    const jobs = sortRows(dashJobs, sort, {
      ref:      j => j.reference,
      introducer: j => introducerLabel(introducerById[j.introducer_client_id]),
      type:     j => getSurveyLabel(j.survey_type || j.job_type),
      postcode: j => j.site_postcode,
      sla:      j => j.sla_deadline,
      value:    j => j.agreed_amount == null ? null : Number(j.agreed_amount),
      dispatch: j => DISPATCH_ORDER[j.dispatch_state] ?? 99,
      urgency:  j => URGENCY_ORDER[j.urgency_state] ?? 99,
      database: j => j.axi_prepared ? 1 : 0,
      drafted:  j => j.report_drafted ? 1 : 0,
    });

    const rows = jobs.map(j => `
      <tr class="${jobUrgencyRowClass(j.urgency_state)}"
          onclick="window.location.href='job-detail.html?id=${j.id}'" style="cursor:pointer">
        <td>
          <div class="ref">${j.reference || '—'}</div>
          <div class="muted">${j.survey_date ? formatDate(j.survey_date) : 'No date set'}</div>
        </td>
        <td>${getSurveyLabel(j.survey_type || j.job_type)}</td>
        <td>${j.introducer_client_id ? escapeHtml(introducerLabel(introducerById[j.introducer_client_id])) : '<span class="muted">Direct</span>'}</td>
        <td>${j.site_postcode || '—'}</td>
        <td>${slaCountdown(j.sla_deadline)}</td>
        <td>${j.agreed_amount ? '£' + Number(j.agreed_amount).toLocaleString() : '—'}</td>
        <td>${dispatchBadge(j.dispatch_state, j)}</td>
        <td>${urgencyColorBadge(j.urgency_state)}</td>
        <td class="tick-cell" onclick="event.stopPropagation()">${progressTick(j, 'axi_prepared')}</td>
        <td class="tick-cell" onclick="event.stopPropagation()">${progressTick(j, 'report_drafted')}</td>
      </tr>
    `).join('');

    document.getElementById('urgencyDashboard').innerHTML = `
      ${sortHint(sort)}
      <table class="data-table compact urgency-tinted">
        <thead>
          <tr>
            ${sortTh('Reference', 'ref', sort)}
            ${sortTh('Survey Type', 'type', sort)}
            ${sortTh('Introducer', 'introducer', sort)}
            ${sortTh('Postcode', 'postcode', sort)}
            ${sortTh('SLA Deadline', 'sla', sort)}
            ${sortTh('Value', 'value', sort)}
            ${sortTh('Stage', 'dispatch', sort)}
            ${sortTh('Urgency', 'urgency', sort)}
            ${sortTh('Database', 'database', sort)}
            ${sortTh('Report Drafted', 'drafted', sort)}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
}

// ============================================================
// GLOBAL SEARCH
// ============================================================

let _searchTimer = null;

function handleGlobalSearch(q) {
  clearTimeout(_searchTimer);
  const box = document.getElementById('searchResults');
  if (!q || q.trim().length < 2) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = '<div style="padding:12px 16px;font-size:13px;color:var(--text-muted);">Searching…</div>';
  _searchTimer = setTimeout(() => runGlobalSearch(q.trim()), 300);
}

async function runGlobalSearch(q) {
  const box = document.getElementById('searchResults');
  try {
    // PostgREST's or=(...) uses commas and parentheses as syntax, so strip them from the term
    const term = q.replace(/[,()*]/g, ' ').trim();
    const [jobs, clients] = await Promise.all([
      dbGet('jobs', {
        'select': 'id,reference,survey_type,site_postcode,dispatch_state,end_client_name,introducer_client_id',
        'or': `(reference.ilike.*${term}*,job_number.ilike.*${term}*,site_postcode.ilike.*${term}*,end_client_name.ilike.*${term}*,site_street.ilike.*${term}*)`,
        'limit': 5
      }),
      dbGet('clients', {
        'select': 'id,full_name,company_name,email,client_type',
        'or': `(full_name.ilike.*${term}*,company_name.ilike.*${term}*,email.ilike.*${term}*)`,
        'limit': 5
      }),
    ]);

    // Jobs sent by a matching introducer (introducers are 'agent' clients)
    const introIds = (clients || []).filter(c => c.client_type === 'agent').map(c => c.id);
    const introducedJobs = introIds.length ? await dbGet('jobs', {
      'select': 'id,reference,survey_type,site_postcode,dispatch_state,end_client_name,introducer_client_id',
      'introducer_client_id': `in.(${introIds.join(',')})`,
      'order': 'created_at.desc',
      'limit': 8
    }) : [];
    const seen = new Set((jobs || []).map(j => j.id));
    const allJobs = [...(jobs || []), ...(introducedJobs || []).filter(j => !seen.has(j.id))];
    const introName = id => { const c = (clients || []).find(x => x.id === id); return c ? (c.company_name || c.full_name) : ''; };

    const sections = [];

    if (allJobs.length) {
      sections.push(`<div style="padding:8px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Jobs</div>`);
      allJobs.forEach(j => {
        sections.push(`<a href="job-detail.html?id=${j.id}" style="display:flex;align-items:center;gap:10px;padding:10px 16px;text-decoration:none;color:var(--text);" class="hover-row">
          <span style="display:flex;color:var(--text-muted);">${icon('briefcase', 16)}</span>
          <div>
            <div style="font-weight:600;font-size:13px;">${j.reference || '—'}</div>
            <div style="font-size:12px;color:var(--text-muted);">${getSurveyLabel(j.survey_type)} · ${j.site_postcode || '—'}${j.end_client_name ? ' · ' + escapeHtml(j.end_client_name) : ''}${j.introducer_client_id && introName(j.introducer_client_id) ? ' · via ' + escapeHtml(introName(j.introducer_client_id)) : ''}</div>
          </div>
        </a>`);
      });
    }

    if (clients?.length) {
      sections.push(`<div style="padding:8px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;border-top:1px solid var(--border);">Clients</div>`);
      clients.forEach(c => {
        sections.push(`<a href="client-detail.html?id=${c.id}" style="display:flex;align-items:center;gap:10px;padding:10px 16px;text-decoration:none;color:var(--text);" class="hover-row">
          <span style="display:flex;color:var(--text-muted);">${icon('user', 16)}</span>
          <div>
            <div style="font-weight:600;font-size:13px;">${c.company_name || c.full_name || '—'}</div>
            <div style="font-size:12px;color:var(--text-muted);">${c.client_type === 'agent' ? 'Introducer' + (c.email ? ' · ' : '') : ''}${c.email || ''}</div>
          </div>
        </a>`);
      });
    }

    if (!sections.length) {
      box.innerHTML = `<div style="padding:16px;font-size:13px;color:var(--text-muted);text-align:center;">No results for "${q}"</div>`;
    } else {
      box.innerHTML = sections.join('');
    }
  } catch (e) {
    box.innerHTML = `<div style="padding:12px 16px;font-size:13px;color:var(--text-muted);">Error: ${e.message}</div>`;
  }
}

// Close search results when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('.topbar-search')) {
    document.getElementById('searchResults').style.display = 'none';
  }
});

init();
</script>
</body>
</html>
