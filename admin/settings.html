<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
<style>
  .pricing-input {
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 14px; font-family: inherit; width: 100%; box-sizing: border-box;
  }
  .pricing-table-wrapper { max-height: 460px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
  .pricing-table-wrapper .data-table { margin: 0; }
  .pricing-table-wrapper thead th { position: sticky; top: 0; background: #f9fafb; z-index: 1; }
  .field-hint { font-size: 12px; color: #999; margin-top: 6px; }
</style>
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script>
requireAuth();

let surveyTypesData = [];
let surchargesData = [];
let travelAreasData = [];

async function init() {
  if (!(await requireAdmin())) return;

  document.getElementById('app').innerHTML = `
    ${renderSidebar('settings')}
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">Settings</div>
      </div>
      <div class="page-body">
        <div class="card">
          <div class="card-title">Pricing Rates</div>
          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #666; text-transform: uppercase; font-size: 12px;">
              THAC Hourly Rate (Customer Quote)
            </label>
            <div style="display: flex; gap: 8px; align-items: center;">
              <span style="font-size: 18px; font-weight: 600; color: #1a1a1a;">£</span>
              <input type="number" id="thacRate" step="0.01" min="0" style="flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;">
              <span style="font-size: 14px; color: #666;">/hour</span>
            </div>
            <div class="field-hint">Used to calculate customer quotes in the public enquiry form. Each surveyor's individual hourly rate is set on their profile.</div>
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #666; text-transform: uppercase; font-size: 12px;">
              First Pick Window
            </label>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="number" id="firstPickHours" step="0.25" min="0" style="flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px;">
              <span style="font-size: 14px; color: #666;">hours</span>
            </div>
            <div class="field-hint">When a job becomes available, surveyors marked "First pick" on their profile get it to themselves for this long, then it opens to everyone in coverage. Next-working-day jobs are never held back. Set to 0 to switch first pick off.</div>
          </div>

          <button class="btn btn-primary" onclick="saveSettings()" style="margin-top: 12px;">
            Save Settings
          </button>
        </div>

        <div class="card">
          <div class="card-title">Survey Type Hours</div>
          <div class="field-hint" style="margin-bottom: 16px;">
            Mirrors the "Survey and Report costs Matrix" spreadsheet. A quote's hours = Report Hours (flat, once per job)
            + On-Site Hours &times; tree-count band (1&ndash;5: 1&ndash;20 trees = 1, 21&ndash;40 = 2, ... 81&ndash;100 = 5).
            Hours are multiplied by the hourly rate above. Travel is added separately (see Travel Cost Areas below).
          </div>
          <div class="card-subtitle" style="font-weight:600; margin:8px 0 6px;">1. On-site survey time (hours per 20-tree band)</div>
          <div id="surveyTypesOnsite"></div>
          <div class="card-subtitle" style="font-weight:600; margin:20px 0 6px;">2. Report writing time (flat hours)</div>
          <div id="surveyTypesReport"></div>
          <button class="btn btn-primary" onclick="saveSurveyTypes()" style="margin-top: 16px;">
            Save Survey Type Hours
          </button>
        </div>

        <div class="card">
          <div class="card-title">Turnaround Options</div>
          <div class="field-hint" style="margin-bottom: 16px;">
            The surcharge is added on top of the base quote for faster turnaround. Untick <strong>Available</strong> to grey an option out on the public form
            for new surveys so customers can't pick it. (The amend / complete a report form has its own options, below.)
          </div>
          <div id="surchargesTable"></div>
          <label style="display: block; margin: 20px 0 8px; font-weight: 600; color: #666; text-transform: uppercase; font-size: 12px;" for="deadlineNotice">
            Message to customers
          </label>
          <textarea id="deadlineNotice" class="pricing-input" rows="3" maxlength="500"
            placeholder="e.g. Due to high demand, our 3 and 5 day options are temporarily unavailable. We expect to reopen them in November."></textarea>
          <div class="field-hint">Shown under the turnaround options on the public form. Leave blank to show nothing.</div>
          <button class="btn btn-primary" onclick="saveSurcharges()" style="margin-top: 16px;">
            Save Turnaround Options
          </button>
        </div>

        <div class="card">
          <div class="card-title">Amend / Complete a Report: Turnaround</div>
          <div class="field-hint" style="margin-bottom: 16px;">
            For the amend or complete a report form you send to regular clients. The surcharge is added to the amendment or report cost.
            Untick <strong>Available</strong> to grey an option out while you're busy.
          </div>
          <div id="requestOptionsTable"></div>
          <button class="btn btn-primary" onclick="saveRequestOptions()" style="margin-top: 16px;">
            Save Report Request Options
          </button>
        </div>

        <div class="card">
          <div class="card-title">Travel Cost Areas</div>
          <div class="field-hint" style="margin-bottom: 16px;">
            Postcode-area travel costs and the customer-facing note shown for £400/£500 areas (e.g. "consider a local consultant").
            This is the live gate for who can submit an enquiry — an area not listed here is out of area.
          </div>
          <div id="travelAreasTable"></div>
          <button class="btn btn-primary" onclick="saveTravelAreas()" style="margin-top: 16px;">
            Save Travel Cost Areas
          </button>
        </div>
      </div>
    </div>
  `;

  await loadSettings();
  await loadSurveyTypes();
  await loadSurcharges();
  await loadRequestOptions();
  await loadTravelAreas();
}

// ---- Hourly rate (existing) ----

async function loadSettings() {
  try {
    const data = await dbGet('pricing_settings', { limit: 1 });
    if (data?.[0]) {
      document.getElementById('thacRate').value = data[0].thac_hourly_rate || 100;
      document.getElementById('firstPickHours').value = data[0].first_pick_hours ?? 1;
    }
  } catch (e) {
    showToast('Error loading settings: ' + e.message, 'error');
  }
}

async function saveSettings() {
  const thacRate = parseFloat(document.getElementById('thacRate').value);

  if (!thacRate || thacRate <= 0) {
    showToast('Please enter a valid positive rate', 'error');
    return;
  }

  try {
    const fpHours = parseFloat(document.getElementById('firstPickHours').value);
    if (isNaN(fpHours) || fpHours < 0) {
      showToast('First pick window must be 0 or more hours', 'error');
      return;
    }
    await dbUpdate('pricing_settings', 'id=eq.1', {
      thac_hourly_rate: thacRate,
      first_pick_hours: fpHours
    });
    showToast('Settings saved');
  } catch (e) {
    showToast('Error saving settings: ' + e.message, 'error');
  }
}

// ---- Survey type hours ----

async function loadSurveyTypes() {
  try {
    surveyTypesData = await dbGet('survey_types', {
      'select': 'id,survey_type,label,report_hours,hours_per_band',
      'order': 'survey_type.asc'
    }) || [];
    renderSurveyTypesTable();
  } catch (e) {
    document.getElementById('surveyTypesOnsite').innerHTML = `<p class="muted">Error loading: ${e.message}</p>`;
  }
}

// Types not offered on the public form (BS Survey is the same job as Planning
// Stage 1/2; Resistograph was dropped from the quote). Hidden here, rows kept in the DB.
const HIDDEN_SURVEY_TYPES = ['bs_survey', 'resistograph'];
// Order follows Trevor's matrix.
const SURVEY_TYPE_ORDER = ['planning_stage1', 'planning_stage2', 'health_safety', 'insurer_mortgage', 'subsidence', 'nhbc', 'site_visit'];
const SURVEY_TYPE_DISPLAY = {
  planning_stage1: 'BS Survey \u2014 Stage 1 report',
  planning_stage2: 'BS Survey \u2014 Stage 2 report',
  health_safety: 'Tree Condition / Risk Survey',
  insurer_mortgage: 'Insurance / Mortgage',
  subsidence: 'Subsidence',
  nhbc: 'Foundation Depths (NHBC)',
  site_visit: 'Site Visit & Advice'
};

function renderSurveyTypesTable() {
  const visible = surveyTypesData
    .filter(st => !HIDDEN_SURVEY_TYPES.includes(st.survey_type))
    .sort((a, b) => SURVEY_TYPE_ORDER.indexOf(a.survey_type) - SURVEY_TYPE_ORDER.indexOf(b.survey_type));
  const name = st => SURVEY_TYPE_DISPLAY[st.survey_type] || st.label || st.survey_type;
  const input = (ids, field, val) =>
    `<input class="pricing-input" type="number" step="0.25" min="0" data-ids="${ids}" data-field="${field}" value="${val}">`;

  // On-site: Stage 1 and Stage 2 are the same survey, so one row writes to both.
  const stage = visible.filter(st => st.survey_type.startsWith('planning_stage'));
  const others = visible.filter(st => !st.survey_type.startsWith('planning_stage'));
  const onsiteRows = [];
  if (stage.length) {
    onsiteRows.push(`<tr><td>BS Survey (Stage 1 &amp; 2)</td><td>${input(stage.map(s => s.id).join(','), 'hours_per_band', stage[0].hours_per_band)}</td></tr>`);
  }
  others.forEach(st => onsiteRows.push(`<tr><td>${name(st)}</td><td>${input(st.id, 'hours_per_band', st.hours_per_band)}</td></tr>`));
  const reportRows = visible.map(st => `<tr><td>${name(st)}</td><td>${input(st.id, 'report_hours', st.report_hours)}</td></tr>`);

  const table = (head, rows, body) => `
    <div class="pricing-table-wrapper">
      <table class="data-table">
        <thead><tr><th>Survey Type</th><th>${head}</th></tr></thead>
        <tbody id="${body}">${rows.join('')}</tbody>
      </table>
    </div>`;
  document.getElementById('surveyTypesOnsite').innerHTML = table('Hours / band', onsiteRows, 'surveyTypesOnsiteBody');
  document.getElementById('surveyTypesReport').innerHTML = table('Report hours', reportRows, 'surveyTypesReportBody');
}

async function saveSurveyTypes() {
  const inputs = document.querySelectorAll('#surveyTypesOnsiteBody input, #surveyTypesReportBody input');
  const byId = {};
  inputs.forEach(input => {
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 0) return;
    input.dataset.ids.split(',').forEach(id => {
      byId[id] = byId[id] || {};
      byId[id][input.dataset.field] = val;
    });
  });

  try {
    await Promise.all(
      Object.entries(byId).map(([id, data]) => dbUpdate('survey_types', `id=eq.${id}`, data))
    );
    showToast('Survey type hours saved');
    await loadSurveyTypes();
  } catch (e) {
    showToast('Error saving: ' + e.message, 'error');
  }
}

// ---- Deadline surcharges ----

async function loadSurcharges() {
  try {
    surchargesData = await dbGet('deadline_surcharges', { 'select': 'tier,label,surcharge,is_available', 'order': 'surcharge.desc' }) || [];
    renderSurchargesTable();
    const settings = await dbGet('pricing_settings', { 'select': 'deadline_notice', 'limit': 1 });
    document.getElementById('deadlineNotice').value = settings?.[0]?.deadline_notice || '';
  } catch (e) {
    document.getElementById('surchargesTable').innerHTML = `<p class="muted">Error loading: ${e.message}</p>`;
  }
}

function renderSurchargesTable() {
  const rows = surchargesData.map(s => `
    <tr>
      <td>${s.label}</td>
      <td style="max-width:140px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span>£</span>
          <input class="pricing-input" type="number" step="1" min="0" data-tier="${s.tier}" value="${s.surcharge}">
        </div>
      </td>
      <td>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" data-available-tier="${s.tier}" ${s.is_available !== false ? 'checked' : ''}>
          <span>Available</span>
        </label>
      </td>
    </tr>
  `).join('');

  document.getElementById('surchargesTable').innerHTML = `
    <table class="data-table">
      <thead><tr><th>Deadline</th><th>Surcharge</th><th>On the form</th></tr></thead>
      <tbody id="surchargesBody">${rows}</tbody>
    </table>`;
}

async function saveSurcharges() {
  const updates = [];
  document.querySelectorAll('#surchargesBody input[data-tier]').forEach(input => {
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 0) return;
    const available = document.querySelector(`#surchargesBody input[data-available-tier="${input.dataset.tier}"]`).checked;
    updates.push({ tier: input.dataset.tier, surcharge: val, is_available: available });
  });

  if (updates.length && updates.every(u => !u.is_available) &&
      !confirm('All turnaround options are switched off, so customers won\'t be able to get a survey quote until one is switched back on. Save anyway?')) {
    return;
  }

  try {
    await Promise.all([
      ...updates.map(u => dbUpdate('deadline_surcharges', `tier=eq.${u.tier}`, { surcharge: u.surcharge, is_available: u.is_available })),
      dbUpdate('pricing_settings', 'id=eq.1', { deadline_notice: document.getElementById('deadlineNotice').value.trim() || null }),
    ]);
    showToast('Turnaround options saved');
    await loadSurcharges();
  } catch (e) {
    showToast('Error saving: ' + e.message, 'error');
  }
}

// ---- Report request (amend / complete a report) turnaround ----

async function loadRequestOptions() {
  try {
    const rows = await dbGet('report_request_options', { 'select': 'tier,label,surcharge,is_available', 'order': 'sort_order.asc' }) || [];
    const body = rows.map(o => `
      <tr>
        <td>${o.label}</td>
        <td style="max-width:140px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span>£</span>
            <input class="pricing-input" type="number" step="1" min="0" data-request-tier="${o.tier}" value="${o.surcharge}">
          </div>
        </td>
        <td>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" data-request-available="${o.tier}" ${o.is_available !== false ? 'checked' : ''}>
            <span>Available</span>
          </label>
        </td>
      </tr>`).join('');
    document.getElementById('requestOptionsTable').innerHTML = `
      <table class="data-table">
        <thead><tr><th>Turnaround</th><th>Surcharge</th><th>On the form</th></tr></thead>
        <tbody id="requestOptionsBody">${body}</tbody>
      </table>`;
  } catch (e) {
    // Before the 20261102000 migration has run the table doesn't exist
    document.getElementById('requestOptionsTable').innerHTML = `<p class="muted">Error loading: ${e.message}</p>`;
  }
}

async function saveRequestOptions() {
  const updates = [];
  document.querySelectorAll('#requestOptionsBody input[data-request-tier]').forEach(input => {
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 0) return;
    const tier = input.dataset.requestTier;
    const available = document.querySelector(`#requestOptionsBody input[data-request-available="${tier}"]`).checked;
    updates.push({ tier, surcharge: val, is_available: available });
  });

  if (updates.length && updates.every(u => !u.is_available) &&
      !confirm('All options are switched off, so clients won\'t be able to send an amend or complete a report request until one is switched back on. Save anyway?')) {
    return;
  }

  try {
    await Promise.all(updates.map(u => dbUpdate('report_request_options', `tier=eq.${u.tier}`,
      { surcharge: u.surcharge, is_available: u.is_available, updated_at: new Date().toISOString() })));
    showToast('Report request options saved');
    await loadRequestOptions();
  } catch (e) {
    showToast('Error saving: ' + e.message, 'error');
  }
}

// ---- Travel cost areas ----

async function loadTravelAreas() {
  try {
    travelAreasData = await dbGet('travel_cost_areas', {
      'select': 'area_code,area_name,travel_cost,note',
      'order': 'area_code.asc'
    }) || [];
    renderTravelAreasTable();
  } catch (e) {
    document.getElementById('travelAreasTable').innerHTML = `<p class="muted">Error loading: ${e.message}</p>`;
  }
}

function escapeAttr(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function renderTravelAreasTable() {
  const rows = travelAreasData.map(a => `
    <tr>
      <td><strong>${a.area_code}</strong></td>
      <td>${a.area_name || '<span class="muted">—</span>'}</td>
      <td style="max-width:120px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span>£</span>
          <input class="pricing-input" type="number" step="1" min="0" data-area="${a.area_code}" data-field="travel_cost" value="${a.travel_cost}">
        </div>
      </td>
      <td>
        <input class="pricing-input" type="text" data-area="${a.area_code}" data-field="note" value="${escapeAttr(a.note)}" placeholder="No note (shown for £300 areas)">
      </td>
    </tr>
  `).join('');

  document.getElementById('travelAreasTable').innerHTML = `
    <div class="pricing-table-wrapper">
      <table class="data-table">
        <thead><tr><th>Area</th><th>Region</th><th>Travel Cost</th><th>Customer-facing note</th></tr></thead>
        <tbody id="travelAreasBody">${rows}</tbody>
      </table>
    </div>`;
}

async function saveTravelAreas() {
  const byArea = {};
  document.querySelectorAll('#travelAreasBody input').forEach(input => {
    const area = input.dataset.area;
    byArea[area] = byArea[area] || {};
    if (input.dataset.field === 'travel_cost') {
      const val = parseFloat(input.value);
      if (!isNaN(val) && val >= 0) byArea[area].travel_cost = val;
    } else {
      byArea[area].note = input.value.trim() || null;
    }
  });

  try {
    await Promise.all(
      Object.entries(byArea).map(([area, data]) => dbUpdate('travel_cost_areas', `area_code=eq.${area}`, data))
    );
    showToast('Travel cost areas saved');
    await loadTravelAreas();
  } catch (e) {
    showToast('Error saving: ' + e.message, 'error');
  }
}

init();
</script>
</body>
</html>
