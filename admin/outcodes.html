<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Postcode Areas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script>
requireAuth();

let allAreas = [];
let postcodeAreas = [];

async function init() {
  document.getElementById('app').innerHTML = `
    ${renderSidebar('outcodes')}
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">Postcode Areas</div>
      </div>
      <div class="page-body">
        <div class="card">
          <div class="card-title">Area-Level Coverage</div>
          <div style="margin-bottom:20px;font-size:13px;color:var(--text-muted);">
            Business-level gate used by the public enquiry form: a postcode is only accepted if its
            broad area (e.g. "GL") is covered here <strong>and</strong> an active surveyor covers the
            exact outcode (see Service Coverage below). This updates automatically as surveyors are
            added, removed, or reactivated — it's not manually editable.
          </div>
          <div id="postcodeAreasTable"><div class="loading"><div class="spinner"></div><br>Loading areas...</div></div>
        </div>
        <div class="card">
          <div class="card-title">Service Coverage</div>
          <div style="margin-bottom:20px;font-size:13px;color:var(--text-muted);">
            Postcode areas automatically covered by active surveyors based on their location and service radius.
          </div>
          <div id="areasTable"><div class="loading"><div class="spinner"></div><br>Loading postcode areas...</div></div>
        </div>
      </div>
    </div>
  `;
  await loadPostcodeAreas();
  await loadAreas();
}

async function loadPostcodeAreas() {
  try {
    postcodeAreas = await dbGet('postcode_areas', { 'select': 'id,area_code,area_name,region,is_covered', 'order': 'area_code.asc' });
    renderPostcodeAreasTable();
  } catch (e) {
    document.getElementById('postcodeAreasTable').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderPostcodeAreasTable() {
  if (!postcodeAreas.length) {
    document.getElementById('postcodeAreasTable').innerHTML = `<div class="empty-state"><p>No postcode areas found.</p></div>`;
    return;
  }

  const rows = postcodeAreas.map(area => `
    <tr>
      <td style="font-weight:600;color:var(--text);">${area.area_code}</td>
      <td>${area.area_name}</td>
      <td>${area.region}</td>
      <td style="text-align:center;">
        <input type="checkbox" disabled ${area.is_covered ? 'checked' : ''} title="Computed automatically from active surveyor coverage">
      </td>
    </tr>
  `).join('');

  document.getElementById('postcodeAreasTable').innerHTML = `
    <table class="data-table">
      <thead><tr><th>Area</th><th>Area Name</th><th>Region</th><th>Covered</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function loadAreas() {
  try {
    // Paginated: surveyor_service_outcodes has grown past PostgREST's default
    // 1000-row cap on an unfiltered select, so a single dbGet() call silently
    // drops rows once the table exceeds that page size.
    const pageSize = 1000;
    let all = [];
    let offset = 0;
    while (true) {
      const page = await dbGet('surveyor_service_outcodes', {
        'select': 'outcode,uk_outcodes(area_name)',
        'limit': String(pageSize),
        'offset': String(offset)
      });
      all = all.concat(page || []);
      if (!page || page.length < pageSize) break;
      offset += pageSize;
    }
    allAreas = all;
    renderTable();
  } catch (e) {
    document.getElementById('areasTable').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderTable() {
  if (!allAreas.length) {
    document.getElementById('areasTable').innerHTML = `<div class="empty-state"><p>No postcode areas covered yet. Add surveyors with postcode and radius to expand coverage.</p></div>`;
    return;
  }

  // Group by outcode and count surveyors
  const grouped = {};
  allAreas.forEach(item => {
    const outcode = item.outcode;
    if (!grouped[outcode]) {
      grouped[outcode] = {
        outcode,
        areaName: item.uk_outcodes?.area_name || '—',
        surveyorCount: 0
      };
    }
    grouped[outcode].surveyorCount++;
  });

  // Sort by outcode
  const sorted = Object.values(grouped).sort((a, b) => a.outcode.localeCompare(b.outcode));

  const rows = sorted.map(area => `
    <tr>
      <td style="font-weight:600;color:var(--text);">${area.outcode}</td>
      <td>${area.areaName}</td>
      <td style="text-align:center;">${area.surveyorCount}</td>
    </tr>
  `).join('');

  document.getElementById('areasTable').innerHTML = `
    <table class="data-table">
      <thead><tr><th>Area</th><th>Area Name</th><th>Surveyors</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

init();
</script>
</body>
</html>
