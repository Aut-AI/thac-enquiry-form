<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Postcode Areas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script>
requireAuth();

let allAreas = [];

async function init() {
  document.getElementById('app').innerHTML = `
    ${renderSidebar('outcodes')}
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">Postcode Areas</div>
      </div>
      <div class="page-body">
        <div class="card">
          <div class="card-title">Service Coverage</div>
          <div style="margin-bottom:20px;font-size:13px;color:var(--text-muted);">
            Postcode areas automatically covered by active surveyors based on their location and service radius.
          </div>
          <div id="areasTable"><div class="loading"><div class="spinner"></div><br>Loading postcode areas...</div></div>
        </div>
      </div>
    </div>
  `;
  await loadAreas();
}

async function loadAreas() {
  try {
    const data = await dbGet('surveyor_service_outcodes', {
      'select': 'outcode,uk_outcodes(area_name)'
    });
    allAreas = data || [];
    renderTable();
  } catch (e) {
    document.getElementById('areasTable').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderTable() {
  if (!allAreas.length) {
    document.getElementById('areasTable').innerHTML = `<div class="empty-state"><p>No postcode areas covered yet. Add surveyors with postcode and radius to expand coverage.</p></div>`;
    return;
  }

  // Group by outcode and count surveyors
  const grouped = {};
  allAreas.forEach(item => {
    const outcode = item.outcode;
    if (!grouped[outcode]) {
      grouped[outcode] = {
        outcode,
        areaName: item.uk_outcodes?.area_name || '—',
        surveyorCount: 0
      };
    }
    grouped[outcode].surveyorCount++;
  });

  // Sort by outcode
  const sorted = Object.values(grouped).sort((a, b) => a.outcode.localeCompare(b.outcode));

  const rows = sorted.map(area => `
    <tr>
      <td style="font-weight:600;color:var(--text);">${area.outcode}</td>
      <td>${area.areaName}</td>
      <td style="text-align:center;">${area.surveyorCount}</td>
    </tr>
  `).join('');

  document.getElementById('areasTable').innerHTML = `
    <table class="data-table">
      <thead><tr><th>Area</th><th>Area Name</th><th>Surveyors</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

init();
</script>
</body>
</html>
