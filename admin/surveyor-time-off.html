<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveyor Availability — THAC Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/thac.css">
  <style>
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .nav-arrow {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: #1a3c2e;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-arrow:hover { background: #f3f4f6; }
    .nav-arrow:disabled { opacity: 0.4; cursor: default; background: white; }
    .range-label {
      font-size: 15px;
      font-weight: 600;
      color: #1a3c2e;
      min-width: 220px;
      text-align: center;
    }
    .surveyor-filter {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a3c2e;
      background: white;
      cursor: pointer;
      min-width: 200px;
    }
    .months-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .calendar-wrapper {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }
    .month-header {
      font-size: 16px;
      font-weight: 700;
      color: #1a3c2e;
      text-align: center;
    }
    .row-count {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 16px;
    }
    .calendar-container {
      display: flex;
      gap: 0;
      background: white;
      /* Header row + 6 data rows @ 54px each -- the rest scroll into view. */
      max-height: 378px;
      overflow-y: auto;
    }
    .surveyor-names-column {
      display: flex;
      flex-direction: column;
      background: #f9fafb;
      border-right: 2px solid #d1d5db;
      flex-shrink: 0;
    }
    .surveyor-name {
      box-sizing: border-box;
      background: #f9fafb;
      padding: 6px 10px;
      font-weight: 600;
      font-size: 13px;
      color: #1a3c2e;
      height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 150px;
      border-bottom: 1px solid #e5e7eb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .surveyor-name .email {
      font-weight: 400;
      font-size: 11px;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .surveyor-name.header {
      background: #f3f4f6;
      font-weight: 700;
      border-bottom: none;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .calendar {
      display: grid;
      grid-auto-rows: 54px;
      column-gap: 1px;
      row-gap: 0;
      background: #e5e7eb;
      padding: 0 1px;
      overflow-x: auto;
      overflow-y: visible;
    }
    .day-header {
      box-sizing: border-box;
      background: #f3f4f6;
      padding: 8px 4px;
      text-align: center;
      font-weight: 600;
      font-size: 12px;
      color: #6b7280;
      height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .day-header .weekday-initial {
      font-weight: 500;
      font-size: 10px;
      color: #9ca3af;
    }
    .day-cell {
      box-sizing: border-box;
      background: #fff;
      padding: 4px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border-bottom: 1px solid #e5e7eb;
    }
    .day-available {
      background: #dcfce7;
      border: 1px solid #86efac;
    }
    .day-number {
      font-size: 10px;
      color: #9ca3af;
    }
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 3px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>
<div class="app-layout" id="app"></div>
<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script>
  requireAuth();

  // First of the three months currently shown. Starts on the current month;
  // shiftWindow() slides it earlier/later one month at a time.
  let windowStart = new Date();
  windowStart.setDate(1);

  async function initPage() {
    document.getElementById('app').innerHTML = `
      ${renderSidebar('availability')}
      <div class="main-content">
        <div class="topbar">
          <div class="topbar-title">Surveyor Availability</div>
        </div>
        <div class="page-body">
          <div class="card">
            <div class="card-title">Surveyor Availability Calendar</div>
            <div class="controls">
              <button class="nav-arrow" id="upArrow" onclick="shiftWindow(-1)" title="Earlier month">▲</button>
              <div class="range-label" id="rangeLabel"></div>
              <button class="nav-arrow" id="downArrow" onclick="shiftWindow(1)" title="Later month">▼</button>
            </div>
            <div class="controls" style="margin-bottom:20px;">
              <select class="surveyor-filter" id="surveyorFilter" onchange="applySurveyorFilter()">
                <option value="">All surveyors</option>
              </select>
            </div>
            <div id="error" style="display:none;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:16px;border-radius:6px;margin-bottom:16px;"></div>
            <div id="loading" class="loading">Loading...</div>
            <div id="content" style="display:none;">
              <div class="months-stack">
                <div class="calendar-wrapper">
                  <div class="month-header" id="monthHeader0"></div>
                  <div class="row-count" id="rowCount0"></div>
                  <div class="calendar-container">
                    <div class="surveyor-names-column" id="namesColumn0"></div>
                    <div class="calendar" id="calendar0"></div>
                  </div>
                </div>
                <div class="calendar-wrapper">
                  <div class="month-header" id="monthHeader1"></div>
                  <div class="row-count" id="rowCount1"></div>
                  <div class="calendar-container">
                    <div class="surveyor-names-column" id="namesColumn1"></div>
                    <div class="calendar" id="calendar1"></div>
                  </div>
                </div>
                <div class="calendar-wrapper">
                  <div class="month-header" id="monthHeader2"></div>
                  <div class="row-count" id="rowCount2"></div>
                  <div class="calendar-container">
                    <div class="surveyor-names-column" id="namesColumn2"></div>
                    <div class="calendar" id="calendar2"></div>
                  </div>
                </div>
              </div>
              <div class="legend">
                <div class="legend-item">
                  <div class="legend-color" style="background: #dcfce7;border:1px solid #86efac;"></div>
                  <span>Available</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    loadCalendars();
  }

  function shiftWindow(deltaMonths) {
    windowStart = new Date(windowStart.getFullYear(), windowStart.getMonth() + deltaMonths, 1);
    loadCalendars();
  }

  // Cached from the last fetch so the surveyor filter can re-render
  // instantly (no refetch) when changed.
  let currentSurveyors = [];
  let currentAvailMap = {};
  let selectedSurveyorId = '';

  function currentMonthDates() {
    return [0, 1, 2].map(i => new Date(windowStart.getFullYear(), windowStart.getMonth() + i, 1));
  }

  function populateSurveyorFilter(surveyors) {
    const select = document.getElementById('surveyorFilter');
    const previousValue = select.value;

    select.innerHTML = '';
    const allOption = document.createElement('option');
    allOption.value = '';
    allOption.textContent = 'All surveyors';
    select.appendChild(allOption);

    surveyors.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.full_name;
      select.appendChild(opt);
    });

    // Keep the current selection across month navigation reloads, as long
    // as that surveyor is still in the (active) list.
    if (surveyors.some(s => s.id === previousValue)) {
      select.value = previousValue;
    } else {
      select.value = '';
      selectedSurveyorId = '';
    }
  }

  function applySurveyorFilter() {
    selectedSurveyorId = document.getElementById('surveyorFilter').value;
    renderAllMonths();
  }

  function renderAllMonths() {
    const filtered = selectedSurveyorId
      ? currentSurveyors.filter(s => s.id === selectedSurveyorId)
      : currentSurveyors;
    currentMonthDates().forEach((monthDate, i) => {
      renderMonthCard(i, monthDate.getFullYear(), monthDate.getMonth(), filtered, currentAvailMap);
    });
  }

  async function loadCalendars() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';
    document.getElementById('error').style.display = 'none';
    document.getElementById('upArrow').disabled = true;
    document.getElementById('downArrow').disabled = true;

    // The three months currently on screen: windowStart, +1, +2.
    const monthDates = [0, 1, 2].map(i =>
      new Date(windowStart.getFullYear(), windowStart.getMonth() + i, 1)
    );
    const rangeStart = monthDates[0];
    const rangeEnd = new Date(monthDates[2].getFullYear(), monthDates[2].getMonth() + 1, 0); // last day of 3rd month

    document.getElementById('rangeLabel').textContent =
      `${rangeStart.toLocaleString('en-GB', { month: 'long' })} – ` +
      `${rangeEnd.toLocaleString('en-GB', { month: 'long', year: 'numeric' })}`;

    try {
      const surveyors = await dbGet('surveyors', {
        'select': 'id,full_name,email,is_active',
        'order': 'full_name.asc'
      });

      if (!surveyors || !Array.isArray(surveyors)) {
        throw new Error('Failed to load surveyors');
      }

      const startStr = ymd(rangeStart);
      const endStr = ymd(rangeEnd);
      const availability = await dbGet('surveyor_availability', {
        'select': 'surveyor_id,date,is_available',
        'and': `(date.gte.${startStr},date.lte.${endStr})`
      });

      // Map of "surveyorId_YYYY-MM-DD" -> is_available
      const availMap = {};
      (availability || []).forEach(row => {
        availMap[`${row.surveyor_id}_${row.date}`] = row.is_available;
      });

      currentSurveyors = surveyors.filter(s => s.is_active);
      currentAvailMap = availMap;

      populateSurveyorFilter(currentSurveyors);
      renderAllMonths();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    } catch (err) {
      console.error(err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = err.message || 'Error loading calendar';
    } finally {
      document.getElementById('upArrow').disabled = false;
      document.getElementById('downArrow').disabled = false;
    }
  }

  const WEEKDAY_INITIALS = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; // Sun-first, matches Date#getDay()

  // Builds a "YYYY-MM-DD" string from local y/m/d components directly --
  // going via Date.toISOString() converts to UTC and can roll the date
  // back a day during BST, the same bug fixed on mobile.
  function ymd(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${mm}-${dd}`;
  }

  // Same === true default as the cell colouring below -- a day with no row
  // at all counts as NOT available, matching mobile's default: surveyors
  // start unavailable everywhere until they actively mark days available.
  function countAvailableDays(surveyorId, year, month, daysInMonth, availMap) {
    let count = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = ymd(new Date(year, month, d));
      if (availMap[`${surveyorId}_${dateStr}`] === true) count++;
    }
    return count;
  }

  function renderMonthCard(index, year, month, activeSurveyors, availMap) {
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthName = new Date(year, month).toLocaleString('en-GB', { month: 'long', year: 'numeric' });

    document.getElementById(`monthHeader${index}`).textContent = monthName;
    document.getElementById(`rowCount${index}`).textContent =
      `${activeSurveyors.length} surveyor${activeSurveyors.length !== 1 ? 's' : ''}` +
      (activeSurveyors.length > 6 ? ' — sorted by availability, scroll for more' : ' — sorted by availability');

    const calendar = document.getElementById(`calendar${index}`);
    const namesColumn = document.getElementById(`namesColumn${index}`);
    calendar.innerHTML = '';
    namesColumn.innerHTML = '';

    calendar.style.gridTemplateColumns = `repeat(${daysInMonth}, 30px)`;

    // Most available days this month first.
    const sortedSurveyors = [...activeSurveyors].sort((a, b) =>
      countAvailableDays(b.id, year, month, daysInMonth, availMap) -
      countAvailableDays(a.id, year, month, daysInMonth, availMap)
    );

    const headerName = document.createElement('div');
    headerName.className = 'surveyor-name header';
    headerName.textContent = 'Surveyor';
    namesColumn.appendChild(headerName);

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day-header';
      const weekday = new Date(year, month, d).getDay();
      cell.innerHTML = `<span>${d}</span><span class="weekday-initial">${WEEKDAY_INITIALS[weekday]}</span>`;
      calendar.appendChild(cell);
    }

    sortedSurveyors.forEach(surveyor => {
      const nameCell = document.createElement('div');
      nameCell.className = 'surveyor-name';
      const nameLine = document.createElement('span');
      nameLine.textContent = surveyor.full_name;
      nameCell.appendChild(nameLine);
      if (surveyor.email) {
        const emailLine = document.createElement('span');
        emailLine.className = 'email';
        emailLine.textContent = surveyor.email;
        nameCell.appendChild(emailLine);
      }
      namesColumn.appendChild(nameCell);

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = ymd(new Date(year, month, d));
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        // Matches the mobile calendar's own default (AvailabilityCalendar.tsx:
        // `availability[date] === true`) -- a day with no row at all is
        // treated as NOT available, same as a day explicitly marked false.
        // Surveyors start unavailable everywhere and only show green once
        // they've actively marked a day, on both mobile and here.
        if (availMap[`${surveyor.id}_${dateStr}`] === true) {
          cell.className += ' day-available';
        }
        cell.innerHTML = `<span class="day-number">${d}</span>`;
        calendar.appendChild(cell);
      }
    });
  }

  initPage();
</script>
</body>
</html>
