<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Jobs</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script src="js/entry.js"></script>
<script>
requireAuth();

let allJobs = [];
let activeFilter = 'all';
let activeUrgency = 'all';
let searchQuery = '';
let activeIntroducer = 'all';
let introducerById = {};
let introducerList = [];
let filterOpen = false;
let activeReports = 'all';   // all | to_generate | generated
let sort = { key: 'created', dir: 'desc' };

// Read urgency param from dashboard stat card links
const _urlParams = new URLSearchParams(window.location.search);
if (_urlParams.get('urgency')) activeUrgency = _urlParams.get('urgency');
if (_urlParams.get('dispatch')) activeFilter = _urlParams.get('dispatch');
if (_urlParams.get('reports')) activeReports = _urlParams.get('reports');

async function init() {
  document.getElementById('app').innerHTML = `
    ${renderSidebar('jobs')}
    <div class="main-content">
      <div class="topbar">
        <div class="topbar-title">Jobs</div>
        <div class="topbar-search">
          <span>${icon('search')}</span>
          <input type="text" placeholder="Search by ref, postcode, name, introducer..." oninput="handleSearch(this.value)">
        </div>
        <button class="btn btn-primary btn-sm" onclick="openNewJobModal()">${icon('plus', 14)}New job</button>
      </div>
      <div class="page-body">
        <div class="card">
          <div class="card-title">
            All Jobs
            <span style="font-size:13px;font-weight:400;color:var(--text-muted)" id="jobCount"></span>
          </div>
          <div id="filterBar"></div>
          <div id="jobsTable"><div class="loading"><div class="spinner"></div><br>Loading jobs...</div></div>
        </div>
      </div>
    </div>
  `;

  await loadJobs();
}

async function loadJobs() {
  try {
    const jobsData = await dbGet('jobs', {
      'select': 'id,reference,job_type,survey_type,urgency_state,dispatch_state,site_postcode,survey_date,agreed_amount,billing_mode,is_archived,created_at,billing_contact_name,billing_contact_email,billing_address,report_addressee_name,report_addressee_address,report_title,site_access_notes,site_boundary_polygon,enquiry_id,surveyor_id,introducer_client_id,extended_info_received,report_to_generate,report_generated,end_client_name',
      'order': 'created_at.desc',
      'limit': 1000
    });

    const [surveyors, introducers] = await Promise.all([
      dbGet('surveyors', { 'select': 'id,full_name' }),
      loadIntroducers(),
    ]);
    introducerById = {};
    introducers.forEach(i => { introducerById[i.id] = i; });
    introducerList = introducers;
    const surveyorNameById = {};
    (surveyors || []).forEach(s => { surveyorNameById[s.id] = s.full_name; });

    allJobs = (jobsData || []).map(job => ({
      ...job,
      surveyor_name: job.surveyor_id ? (surveyorNameById[job.surveyor_id] || 'Unknown surveyor') : null,
    }));

    renderTable();
  } catch (e) {
    document.getElementById('jobsTable').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function renderTable() {
  renderFilterBar();
  let filtered = allJobs;

  if (activeFilter !== 'all') {
    if (activeFilter === 'archived') {
      filtered = filtered.filter(j => j.dispatch_state === 'archived');
    } else {
      filtered = filtered.filter(j => j.dispatch_state === activeFilter);
    }
  } else {
    filtered = filtered.filter(j => !j.is_archived);
  }

  if (activeUrgency !== 'all') {
    filtered = filtered.filter(j => j.urgency_state === activeUrgency);
  }

  if (activeIntroducer === 'none') {
    filtered = filtered.filter(j => !j.introducer_client_id);
  } else if (activeIntroducer !== 'all') {
    filtered = filtered.filter(j => j.introducer_client_id === activeIntroducer);
  }

  // Report flags only count once a job is allocated (same rule as the dashboard)
  if (activeReports === 'to_generate') {
    filtered = filtered.filter(j => j.surveyor_id && j.report_to_generate && !j.report_generated);
  } else if (activeReports === 'generated') {
    filtered = filtered.filter(j => j.surveyor_id && j.report_generated);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(j =>
      (j.reference || '').toLowerCase().includes(q) ||
      (j.site_postcode || '').toLowerCase().includes(q) ||
      jobName(j).toLowerCase().includes(q) ||
      introducerLabel(introducerById[j.introducer_client_id]).toLowerCase().includes(q)
    );
  }

  document.getElementById('jobCount').textContent = `${filtered.length} record${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    document.getElementById('jobsTable').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${icon('briefcase', 48)}</div>
        <h3>No jobs found</h3>
        <p>Jobs will appear here once enquiries are approved</p>
      </div>`;
    return;
  }

  filtered = sortRows(filtered, sort, {
    ref:         j => j.reference || j.id,
    name:        j => jobName(j),
    introducer:  j => introducerLabel(introducerById[j.introducer_client_id]),
    created:     j => j.created_at,
    type:        j => getSurveyLabel(j.survey_type || j.job_type),
    postcode:    j => j.site_postcode,
    surveyDate:  j => j.survey_date,
    urgency:     j => URGENCY_ORDER[j.urgency_state] ?? 99,
    dispatch:    j => DISPATCH_ORDER[j.dispatch_state] ?? 99,
    info:        j => j.extended_info_received ? 1 : 0,
    surveyor:    j => j.surveyor_name,
    generated:   j => j.report_generated ? 1 : 0,
    value:       j => j.agreed_amount == null ? null : Number(j.agreed_amount),
  });

  const rows = filtered.map(j => {
    const surveyorCell = j.surveyor_name
      ? `<span class="badge badge-accepted">${j.surveyor_name}</span>`
      : '<span class="badge badge-low">Unclaimed</span>';
    const infoStatus = j.extended_info_received ? `<span class="badge badge-accepted">${icon('checkCircle')}Received</span>` : `<span class="badge badge-low">${icon('clock')}Pending</span>`;
    return `
    <tr onclick="window.location.href='job-detail.html?id=${j.id}'" style="cursor:pointer">
      <td><div class="ref">${j.reference || j.id.slice(0,8).toUpperCase()}</div></td>
      <td>${jobName(j) ? escapeHtml(jobName(j)) : '<span class="muted">—</span>'}</td>
      <td>${j.introducer_client_id ? escapeHtml(introducerLabel(introducerById[j.introducer_client_id])) : '<span class="muted">Direct</span>'}</td>
      <td>${j.created_at ? formatDate(j.created_at) : '<span class="muted">—</span>'}</td>
      <td>${getSurveyLabel(j.survey_type || j.job_type)}</td>
      <td>${j.site_postcode || '—'}</td>
      <td>${j.survey_date ? formatDate(j.survey_date) : '<span class="muted">TBC</span>'}</td>
      <td>${urgencyColorBadge(j.urgency_state)}</td>
      <td>${dispatchBadge(j.dispatch_state)}</td>
      <td>${infoStatus}</td>
      <td>${surveyorCell}</td>
      <td class="tick-cell" onclick="event.stopPropagation()">${reportTick(j, 'report_generated')}</td>
      <td>${j.agreed_amount ? '£' + Number(j.agreed_amount).toLocaleString() : '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById('jobsTable').innerHTML = `
    <table class="data-table compact">
      <thead>
        <tr>
          ${sortTh('Reference', 'ref', sort)}
          ${sortTh('Name', 'name', sort)}
          ${sortTh('Introducer', 'introducer', sort)}
          ${sortTh('Date Created', 'created', sort)}
          ${sortTh('Survey Type', 'type', sort)}
          ${sortTh('Postcode', 'postcode', sort)}
          ${sortTh('Survey Date', 'surveyDate', sort)}
          ${sortTh('Urgency', 'urgency', sort)}
          ${sortTh('Dispatch', 'dispatch', sort)}
          ${sortTh('Info', 'info', sort)}
          ${sortTh('Surveyor', 'surveyor', sort)}
          ${sortTh('Report Generated', 'generated', sort)}
          ${sortTh('Value', 'value', sort)}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

const STATUS_FILTERS = [
  ['all', 'All', null],
  ['pending_approval', 'Pending', 'clock'],
  ['waiting_for_plans', 'Waiting', 'clock'],
  ['red', 'Unallocated', 'urgent'],
  ['orange', 'Claimed', 'elevated'],
  ['yellow', 'Attended', 'standard'],
  ['green', 'Report Sent', 'complete'],
  ['archived', 'Archived', 'archive'],
];
const URGENCY_FILTERS = [['all', 'Any', null], ['red', 'Urgent', 'urgent'], ['orange', 'Elevated', 'elevated'], ['yellow', 'Standard', 'standard'], ['grey', 'Low', 'low']];
const REPORT_FILTERS = [['all', 'Any'], ['to_generate', 'To generate'], ['generated', 'Generated']];

function statusCount(key) {
  if (key === 'all') return allJobs.filter(j => !j.is_archived).length;
  return allJobs.filter(j => j.dispatch_state === key).length;
}

function activeFilterChips() {
  const chips = [];
  if (activeUrgency !== 'all') chips.push(['urgency', 'Urgency: ' + (URGENCY_FILTERS.find(u => u[0] === activeUrgency)?.[1] || activeUrgency)]);
  if (activeReports !== 'all') chips.push(['reports', 'Reports: ' + (REPORT_FILTERS.find(r => r[0] === activeReports)?.[1] || activeReports)]);
  if (activeIntroducer === 'none') chips.push(['introducer', 'Direct, no introducer']);
  else if (activeIntroducer !== 'all') chips.push(['introducer', 'Introducer: ' + introducerLabel(introducerById[activeIntroducer])]);
  return chips;
}

function renderFilterBar() {
  const el = document.getElementById('filterBar');
  if (!el) return;
  const chips = activeFilterChips();
  const pill = (on, onclick, inner) => `<button type="button" class="fpill${on ? ' on' : ''}" onclick="${onclick}">${inner}</button>`;
  el.innerHTML = `
    <div class="fbar">
      <div class="seg" role="group" aria-label="Job status">
        ${STATUS_FILTERS.map(([key, label, ic]) => `
          <button type="button" class="${activeFilter === key ? 'on' : ''}" onclick="setFilter('${key}')">
            ${ic ? (['urgent','elevated','standard','complete','low'].includes(ic) ? dot(ic) : icon(ic, 14)) : ''}${label}
            <span class="seg-n">${statusCount(key)}</span>
          </button>`).join('')}
      </div>
      <div class="fwrap">
        <button type="button" class="fbtn${filterOpen ? ' open' : ''}${chips.length ? ' has' : ''}" onclick="toggleFilters(event)" aria-expanded="${filterOpen}">
          ${icon('filter', 15)}Filters${chips.length ? `<span class="fbadge">${chips.length}</span>` : ''}
        </button>
        <div class="fpop" ${filterOpen ? '' : 'hidden'} onclick="event.stopPropagation()">
          <div class="fgroup"><div class="flabel">Urgency</div><div class="fpills">
            ${URGENCY_FILTERS.map(([k, l, ic]) => pill(activeUrgency === k, `setUrgency('${k}')`, (ic ? dot(ic) : '') + l)).join('')}
          </div></div>
          <div class="fgroup"><div class="flabel">Reports <span>(allocated jobs)</span></div><div class="fpills">
            ${REPORT_FILTERS.map(([k, l]) => pill(activeReports === k, `setReports('${k}')`, l)).join('')}
          </div></div>
          <div class="fgroup"><div class="flabel">Introducer</div>
            <select class="form-control" onchange="setIntroducer(this.value)">
              <option value="all">All introducers</option>
              <option value="none" ${activeIntroducer === 'none' ? 'selected' : ''}>Direct (no introducer)</option>
              ${introducerList.map(i => `<option value="${i.id}" ${activeIntroducer === i.id ? 'selected' : ''}>${escapeHtml(introducerLabel(i))}</option>`).join('')}
            </select></div>
          <div class="ffoot"><button type="button" class="flink" onclick="clearFilters()" ${chips.length ? '' : 'disabled'}>Clear filters</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="toggleFilters(event)">Done</button></div>
        </div>
      </div>
      ${chips.map(([key, text]) => `<span class="fchip">${escapeHtml(text)}<button type="button" aria-label="Remove filter" onclick="clearOne('${key}')">&times;</button></span>`).join('')}
      <span class="fhint">Shift-click column headers to sort by several</span>
    </div>`;
  // Keep the popover on screen: if it would run off the right edge, line it up with the button's right edge instead.
  if (filterOpen) {
    const pop = el.querySelector('.fpop');
    if (pop && pop.getBoundingClientRect().right > window.innerWidth - 12) { pop.style.left = 'auto'; pop.style.right = '0'; }
  }
}

function toggleFilters(ev) {
  if (ev) ev.stopPropagation();
  filterOpen = !filterOpen;
  renderFilterBar();
}

function setFilter(filter) { activeFilter = filter; renderTable(); }
function setUrgency(urgency) { activeUrgency = urgency; renderTable(); }
function setReports(value) { activeReports = value; renderTable(); }

function clearOne(key) {
  if (key === 'urgency') activeUrgency = 'all';
  if (key === 'reports') activeReports = 'all';
  if (key === 'introducer') activeIntroducer = 'all';
  renderTable();
}

function clearFilters() {
  activeUrgency = 'all'; activeReports = 'all'; activeIntroducer = 'all';
  renderTable();
}

document.addEventListener('click', (e) => {
  if (filterOpen && !e.target.closest('.fwrap')) { filterOpen = false; renderFilterBar(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && filterOpen) { filterOpen = false; renderFilterBar(); }
});

// Who the job is for: the billing contact (form jobs) or the end client (imported jobs)
function jobName(j) {
  return j.billing_contact_name || j.end_client_name || '';
}

function setSort(key, ev) {
  sort = nextSort(sort, key, 'asc', isAddLevel(ev));
  renderTable();
}

// Report tickboxes: only available once a surveyor is allocated to the job.
function reportTick(j, field) {
  const allocated = !!j.surveyor_id;
  return `<input type="checkbox" ${j[field] ? 'checked' : ''} ${allocated ? '' : 'disabled'}
    title="${allocated ? '' : 'Available once the job is allocated to a surveyor'}"
    onchange="toggleReport('${j.id}', '${field}', this)">`;
}

async function toggleReport(id, field, el) {
  const job = allJobs.find(j => j.id === id);
  const checked = el.checked;
  try {
    await dbUpdate('jobs', `id=eq.${id}`, { [field]: checked });
    job[field] = checked;
    showToast(`${field === 'report_generated' ? 'Report generated' : 'Report to generate'}: ${checked ? 'ticked' : 'unticked'}`);
    if (activeReports !== 'all') renderTable();
  } catch (e) {
    el.checked = !checked;
    showToast('Error: ' + e.message, 'error');
  }
}

function setIntroducer(value) {
  activeIntroducer = value;
  renderTable();
}

function handleSearch(q) {
  searchQuery = q;
  renderTable();
}

init();
</script>
</body>
</html>
