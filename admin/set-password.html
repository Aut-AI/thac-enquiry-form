<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Set Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-circle"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" stroke="none"><polygon points="12,2 6.2,11.5 17.8,11.5"/><polygon points="12,7 4.2,18.5 19.8,18.5"/><rect x="10.4" y="18.5" width="3.2" height="3.6" rx="0.5"/></svg></div>
      <h1>THAC CRM</h1>
      <p id="pageSub">Choose a password to finish setting up your account.</p>
    </div>

    <div class="login-error" id="formError"></div>

    <div id="formFields">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
      </div>

      <button class="btn btn-primary w-100" id="submitBtn" onclick="handleSubmit()" style="justify-content:center; padding:12px;">
        Set Password &amp; Sign In
      </button>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:12px; color:var(--text-muted);">
      THAC internal system — authorised users only
    </p>
  </div>
</div>

<script src="js/supabase.js"></script>
<script>
  // Reached via the link in an "invite" or "reset password" email, which
  // Supabase redirects to this page with the session token in the URL
  // fragment (never a query param, so it's not logged server-side) --
  // #access_token=...&refresh_token=...&type=invite|recovery. Nothing else
  // in this app parses that fragment today, so without this page those
  // links landed on the plain sign-in form with no way to actually set a
  // password.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const accessToken = hashParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token');
  const expiresIn = hashParams.get('expires_in');
  const linkError = hashParams.get('error_description') || hashParams.get('error');

  if (linkError) {
    showError(decodeURIComponent(linkError.replace(/\+/g, ' ')));
    document.getElementById('formFields').style.display = 'none';
  } else if (!accessToken) {
    showError("This link is missing or malformed. Ask an admin to send you a new invite or password reset.");
    document.getElementById('formFields').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('formError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });

  async function handleSubmit() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('submitBtn');

    document.getElementById('formError').style.display = 'none';

    if (!password || password.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }
    if (password !== confirmPassword) {
      showError("Passwords don't match.");
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      // Sets the password on the account this recovery/invite token belongs
      // to -- the token itself proves ownership of the email, standing in
      // for the current password an existing user would normally supply.
      const updateRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({ password }),
      });
      const user = await updateRes.json();
      if (!updateRes.ok) throw new Error(user.msg || user.error_description || 'Could not set password');

      // Sign them straight in with the same session shape login() stores,
      // so they land in the CRM instead of back at the sign-in form.
      const session = {
        access_token: accessToken,
        refresh_token: refreshToken,
        expires_at: Math.floor(Date.now() / 1000) + parseInt(expiresIn || '3600', 10),
        token_type: 'bearer',
        user,
      };
      localStorage.setItem('thac_session', JSON.stringify(session));
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError(err.message || 'Something went wrong. The link may have expired -- ask an admin to send a new one.');
      btn.disabled = false;
      btn.textContent = 'Set Password & Sign In';
    }
  }
</script>
</body>
</html>
