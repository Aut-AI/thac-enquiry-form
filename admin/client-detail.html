<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAC CRM — Client Detail</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/thac.css">
</head>
<body>
<div class="app-layout" id="app"></div>

<script src="js/supabase.js"></script>
<script src="js/thac.js"></script>
<script src="js/entry.js"></script>
<script>
requireAuth();

const params = new URLSearchParams(window.location.search);
const clientId = params.get('id');
let client = null;
let clientJobs = [];
let introducedJobs = [];
let introducerById = {};
let people = [];       // contacts who work at this firm
let parentFirm = null; // the firm this contact works at

if (!clientId) window.location.href = 'clients.html';

async function init() {
  document.getElementById('app').innerHTML = `
    ${renderSidebar('clients')}
    <div class="main-content">
      <div class="topbar">
        <a href="clients.html" class="btn btn-secondary btn-sm">← Back</a>
        <div class="topbar-title" id="pageTitle">Client Detail</div>
        <button class="btn btn-primary btn-sm" onclick="openNewJobModal({ clientId })">${icon('plus', 14)}Add job</button>
      </div>
      <div class="page-body" id="pageBody">
        <div class="loading"><div class="spinner"></div><br>Loading client...</div>
      </div>
    </div>
  `;
  await loadClient();
}

async function loadClient() {
  try {
    const [clientData, jobsData, introducerList, introducedData] = await Promise.all([
      dbGet('clients', { 'id': `eq.${clientId}`, 'limit': 1 }),
      dbGet('jobs', {
        'arranging_client_id': `eq.${clientId}`,
        'select': 'id,reference,survey_type,urgency_state,dispatch_state,survey_date,agreed_amount,introducer_client_id',
        'order': 'created_at.desc'
      }),
      loadIntroducers(),
      dbGet('jobs', {
        'introducer_client_id': `eq.${clientId}`,
        'select': 'id,reference,survey_type,site_postcode,billing_contact_name,dispatch_state,survey_date,agreed_amount',
        'order': 'created_at.desc'
      })
    ]);

    if (!clientData || clientData.length === 0) {
      document.getElementById('pageBody').innerHTML = `<div class="empty-state"><h3>Client not found</h3></div>`;
      return;
    }

    client = clientData[0];
    try {
      people = await dbGet('clients', { select: 'id,full_name,email,phone', parent_client_id: `eq.${clientId}`, order: 'full_name.asc' }) || [];
      parentFirm = client.parent_client_id ? (await dbGet('clients', { select: 'id,full_name,company_name', id: `eq.${client.parent_client_id}` }))?.[0] || null : null;
    } catch (e) { people = []; parentFirm = null; }
    clientJobs = jobsData || [];
    introducedJobs = introducedData || [];
    introducerById = {};
    (introducerList || []).forEach(i => { introducerById[i.id] = i; });
    const name = client.company_name || client.full_name || '—';
    document.getElementById('pageTitle').textContent = name;
    renderView();
  } catch (e) {
    document.getElementById('pageBody').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

// ============================================================
// VIEW MODE
// ============================================================

// Introducers who have sent this client's jobs (introducers live on each job)
function renderIntroducedBy() {
  const counts = {};
  clientJobs.forEach(j => { if (j.introducer_client_id) counts[j.introducer_client_id] = (counts[j.introducer_client_id] || 0) + 1; });
  const ids = Object.keys(counts);
  const direct = clientJobs.length - ids.reduce((t, id) => t + counts[id], 0);
  if (!clientJobs.length) return '';
  return `
        <div class="card">
          <div class="card-title">Introduced By</div>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;">
            ${ids.map(id => `
              <div style="display:flex;justify-content:space-between;gap:8px;">
                <a href="client-detail.html?id=${id}">${escapeHtml(introducerLabel(introducerById[id]))}</a>
                <span class="muted">${counts[id]} job${counts[id] !== 1 ? 's' : ''}</span>
              </div>`).join('')}
            ${direct ? `<div style="display:flex;justify-content:space-between;gap:8px;"><span>Direct</span><span class="muted">${direct} job${direct !== 1 ? 's' : ''}</span></div>` : ''}
            <div style="font-size:11px;color:var(--text-muted);">Set per job on the job page.</div>
          </div>
        </div>`;
}

function renderView() {
  const name = client.company_name || client.full_name || '—';

  const jobRows = clientJobs.length === 0
    ? `<div class="empty-state" style="padding:24px"><p>No jobs for this client yet</p></div>`
    : clientJobs.map(j => `
      <tr onclick="window.location.href='job-detail.html?id=${j.id}'" style="cursor:pointer">
        <td><div class="ref">${j.reference || '—'}</div></td>
        <td>${getSurveyLabel(j.survey_type)}</td>
        <td>${formatDate(j.survey_date)}</td>
        <td>${j.agreed_amount ? '£' + Number(j.agreed_amount).toLocaleString() : '—'}</td>
        <td>${j.introducer_client_id ? `<a href="client-detail.html?id=${j.introducer_client_id}" onclick="event.stopPropagation()">${escapeHtml(introducerLabel(introducerById[j.introducer_client_id]))}</a>` : '<span class="muted">Direct</span>'}</td>
        <td>${dispatchBadge(j.dispatch_state)}</td>
      </tr>`).join('');

  document.getElementById('pageBody').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-ref">${name}</div>
        <div class="detail-sub">${client.client_type === 'agent' ? 'Introducer firm' : (client.client_type || '')} ${client.client_category ? '· ' + client.client_category : ''}
          ${parentFirm ? ` · works at <a href="client-detail.html?id=${parentFirm.id}">${escapeHtml(parentFirm.company_name || parentFirm.full_name)}</a>` : ''}</div>
      </div>
      ${client.is_archived ? `<span class="badge badge-low" style="margin-left:auto;">Archived</span>` : ''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;">
      <div style="display:flex;flex-direction:column;gap:20px;">

        <div class="card">
          <div class="card-title">Contact Details</div>
          <div class="detail-grid">
            <div class="detail-field">
              <label>Full Name</label>
              <div class="field-value">${client.full_name || '—'}</div>
            </div>
            <div class="detail-field">
              <label>Company</label>
              <div class="field-value">${client.company_name || '—'}</div>
            </div>
            <div class="detail-field">
              <label>Email</label>
              <div class="field-value">
                ${client.email ? mailtoList(client.email) : '—'}
              </div>
            </div>
            <div class="detail-field">
              <label>Other emails</label>
              <div class="field-value">${client.other_emails ? mailtoList(client.other_emails) : '—'}</div>
            </div>
            <div class="detail-field">
              <label>Phone</label>
              <div class="field-value">
                ${client.phone ? `<a href="tel:${client.phone}">${client.phone}</a>` : '—'}
              </div>
            </div>
            <div class="detail-field">
              <label>Client Type</label>
              <div class="field-value">${client.client_type ? client.client_type.replace(/\b\w/g, l => l.toUpperCase()) : '—'}</div>
            </div>
            <div class="detail-field">
              <label>Category</label>
              <div class="field-value">${client.client_category || '—'}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Address</div>
          <div class="detail-grid">
            <div class="detail-field" style="grid-column:1/-1">
              <label>Address</label>
              <div class="field-value">
                ${[client.address_line_1, client.address_line_2].filter(Boolean).join(', ') || '—'}
              </div>
            </div>
            <div class="detail-field">
              <label>City</label>
              <div class="field-value">${client.address_city || '—'}</div>
            </div>
            <div class="detail-field">
              <label>County</label>
              <div class="field-value">${client.address_county || '—'}</div>
            </div>
            <div class="detail-field">
              <label>Postcode</label>
              <div class="field-value">${client.address_postcode || '—'}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Jobs for them (${clientJobs.length}) <span style="font-size:12px;font-weight:400;color:var(--text-muted)">they are the customer</span></div>
          ${clientJobs.length > 0 ? `
          <table class="data-table">
            <thead><tr><th>Ref</th><th>Type</th><th>Survey Date</th><th>Value</th><th>Introducer</th><th>Status</th></tr></thead>
            <tbody>${jobRows}</tbody>
          </table>` : `<div class="empty-state" style="padding:24px"><p>No jobs yet</p></div>`}
        </div>

        ${introducedJobs.length > 0 ? `
        <div class="card">
          <div class="card-title">Jobs they sent us (${introducedJobs.length})
            <span style="font-size:13px;font-weight:400;color:var(--text-muted)">£${introducedJobs.reduce((t, j) => t + Number(j.agreed_amount || 0), 0).toLocaleString()} total</span>
          </div>
          <table class="data-table">
            <thead><tr><th>Ref</th><th>Client</th><th>Postcode</th><th>Type</th><th>Survey Date</th><th>Value</th><th>Status</th></tr></thead>
            <tbody>${introducedJobs.map(j => `
              <tr onclick="window.location.href='job-detail.html?id=${j.id}'" style="cursor:pointer">
                <td><div class="ref">${j.reference || '—'}</div></td>
                <td>${escapeHtml(j.billing_contact_name) || '—'}</td>
                <td>${j.site_postcode || '—'}</td>
                <td>${getSurveyLabel(j.survey_type)}</td>
                <td>${formatDate(j.survey_date)}</td>
                <td>${j.agreed_amount ? '£' + Number(j.agreed_amount).toLocaleString() : '—'}</td>
                <td>${dispatchBadge(j.dispatch_state)}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>` : ''}

      </div>

      <div style="display:flex;flex-direction:column;gap:20px;">
        ${renderIntroducedBy()}

        ${!client.parent_client_id ? `
        <div class="card">
          <div class="card-title">As an introducer</div>
          <div style="font-size:13px;display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;justify-content:space-between;"><span class="muted">Usual fee</span><b>${client.default_fee != null ? '£' + Number(client.default_fee).toLocaleString() : 'Quoted each time'}</b></div>
            <div style="display:flex;justify-content:space-between;"><span class="muted">Usually bill</span><b>${client.default_bill_to === 'end_client' ? 'Their client' : client.default_bill_to === 'introducer' ? 'This firm' : 'Not set'}</b></div>
            <div style="font-size:11px;color:var(--text-muted);">Fills in on New job when this firm is picked. Change under Edit Details.</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">People here (${people.length})
            <button class="btn btn-secondary btn-sm" onclick="openNewCustomerModal({ parentId: clientId, type: 'individual', onCreated: () => loadClient() })">${icon('plus', 12)}Add</button></div>
          ${people.length ? people.map(p => `<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">
              <a href="client-detail.html?id=${p.id}"><b>${escapeHtml(p.full_name || p.email || 'Unnamed')}</b></a>
              <div class="muted">${escapeHtml([p.email, p.phone].filter(Boolean).join(' · '))}</div></div>`).join('')
            : `<div class="muted" style="font-size:12.5px;">The people at this firm who ask for quotes. Pick them as "Who asked" on New job.</div>`}
        </div>` : ''}

        <div class="card">
          <div class="card-title">Quick Actions</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-secondary w-100" style="justify-content:center;" onclick="renderEdit()">${icon('pencil', 14)}Edit Details</button>
            <button class="btn btn-secondary w-100" style="justify-content:center;" onclick="toggleArchive()">${client.is_archived ? 'Unarchive' : 'Archive (hide from lists)'}</button>
            <button class="btn btn-secondary w-100" style="justify-content:center;" onclick="openMerge()">Merge into another contact...</button>
            <button class="btn btn-secondary w-100" style="justify-content:center;color:#c0392b;" onclick="deleteClient()">${icon('trash', 14)}Delete</button>
          </div>
        </div>

        ${client.notes ? `
        <div class="card">
          <div class="card-title">Notes</div>
          <div style="font-size:13px;line-height:1.6;">${client.notes}</div>
        </div>` : ''}
      </div>
    </div>
  `;
}

// ============================================================
// EDIT MODE
// ============================================================

function renderEdit() {
  document.getElementById('pageBody').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-ref">Edit Client</div>
        <div class="detail-sub">${client.company_name || client.full_name || '—'}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;">
      <div style="display:flex;flex-direction:column;gap:20px;">

        <div class="card">
          <div class="card-title">Contact Details</div>
          <div class="detail-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" class="form-control" id="editName" value="${esc(client.full_name)}">
            </div>
            <div class="form-group">
              <label>Company</label>
              <input type="text" class="form-control" id="editCompany" value="${esc(client.company_name)}">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="text" class="form-control" id="editEmail" value="${esc(client.email)}">
            </div>
            <div class="form-group">
              <label>Other emails <span class="muted" style="font-weight:400;">(separate with commas)</span></label>
              <input type="text" class="form-control" id="editOtherEmails" value="${esc(client.other_emails)}">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" class="form-control" id="editPhone" value="${esc(client.phone)}">
            </div>
            <div class="form-group">
              <label>Client Type</label>
              <select class="form-control" id="editType">
                <option value="">— Select —</option>
                <option value="individual" ${client.client_type === 'individual' ? 'selected' : ''}>Individual</option>
                <option value="company"    ${client.client_type === 'company'    ? 'selected' : ''}>Company</option>
                <option value="agent"      ${client.client_type === 'agent'      ? 'selected' : ''}>Introducer firm</option>
                <option value="developer"  ${client.client_type === 'developer'  ? 'selected' : ''}>Developer</option>
              </select>
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" class="form-control" id="editCategory" value="${esc(client.client_category)}" placeholder="e.g. Planning, Insurance...">
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Address</div>
          <div class="detail-grid">
            <div class="form-group" style="grid-column:1/-1">
              <label>Address Line 1</label>
              <input type="text" class="form-control" id="editAddr1" value="${esc(client.address_line_1)}">
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label>Address Line 2</label>
              <input type="text" class="form-control" id="editAddr2" value="${esc(client.address_line_2)}">
            </div>
            <div class="form-group">
              <label>City</label>
              <input type="text" class="form-control" id="editCity" value="${esc(client.address_city)}">
            </div>
            <div class="form-group">
              <label>County</label>
              <input type="text" class="form-control" id="editCounty" value="${esc(client.address_county)}">
            </div>
            <div class="form-group">
              <label>Postcode</label>
              <input type="text" class="form-control" id="editPostcode" value="${esc(client.address_postcode)}" style="text-transform:uppercase">
            </div>
          </div>
        </div>

        ${!client.parent_client_id ? `
        <div class="card">
          <div class="card-title">As an introducer</div>
          <div class="detail-grid">
            <div class="form-group">
              <label>Usual fee (£, excl VAT)</label>
              <input type="number" class="form-control" id="editDefaultFee" min="0" step="0.01" value="${client.default_fee ?? ''}" placeholder="Leave blank if quoted each time">
            </div>
            <div class="form-group">
              <label>Usually bill</label>
              <select class="form-control" id="editDefaultBill">
                <option value="">Not set</option>
                <option value="introducer" ${client.default_bill_to === 'introducer' ? 'selected' : ''}>This firm</option>
                <option value="end_client" ${client.default_bill_to === 'end_client' ? 'selected' : ''}>Their client</option>
              </select>
            </div>
          </div>
        </div>` : ''}

        <div class="card">
          <div class="card-title">Notes</div>
          <div class="form-group">
            <textarea class="form-control" id="editNotes" rows="4" placeholder="Internal notes about this client...">${esc(client.notes)}</textarea>
          </div>
        </div>

      </div>

      <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="card">
          <div class="card-title">Save Changes</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-primary w-100" style="justify-content:center;" onclick="saveEdit()" id="saveEditBtn">
              ${icon('check', 14)}Save Changes
            </button>
            <button class="btn btn-secondary w-100" style="justify-content:center;" onclick="renderView()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// Escape HTML attribute values to prevent breaking inputs
function esc(val) {
  if (!val) return '';
  return String(val).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function saveEdit() {
  const btn = document.getElementById('saveEditBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const updates = {
    full_name:        document.getElementById('editName').value.trim() || null,
    company_name:     document.getElementById('editCompany').value.trim() || null,
    email:            document.getElementById('editEmail').value.trim() || null,
    other_emails:     document.getElementById('editOtherEmails').value.trim() || null,
    phone:            document.getElementById('editPhone').value.trim() || null,
    client_type:      document.getElementById('editType').value || null,
    client_category:  document.getElementById('editCategory').value.trim() || null,
    address_line_1:   document.getElementById('editAddr1').value.trim() || null,
    address_line_2:   document.getElementById('editAddr2').value.trim() || null,
    address_city:     document.getElementById('editCity').value.trim() || null,
    address_county:   document.getElementById('editCounty').value.trim() || null,
    address_postcode: document.getElementById('editPostcode').value.trim().toUpperCase() || null,
    notes:            document.getElementById('editNotes').value.trim() || null,
  };
  const feeEl = document.getElementById('editDefaultFee');
  if (feeEl) {
    updates.default_fee = feeEl.value === '' ? null : Number(feeEl.value);
    updates.default_bill_to = document.getElementById('editDefaultBill').value || null;
  }
  const bad = badEmail(updates.email) || badEmail(updates.other_emails);
  if (bad) {
    showToast(`"${bad}" does not look like an email address`, 'error');
    btn.disabled = false; btn.textContent = 'Save Changes';
    return;
  }
  if (!updates.full_name && !updates.company_name) {
    showToast('Enter a contact name or a company', 'error');
    btn.disabled = false; btn.textContent = 'Save Changes';
    return;
  }

  try {
    await dbUpdate('clients', `id=eq.${clientId}`, updates);
    Object.assign(client, updates);
    const name = client.company_name || client.full_name || '—';
    document.getElementById('pageTitle').textContent = name;
    showToast('Client updated');
    renderView();
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
}


// ============================================================
// ARCHIVE / MERGE / DELETE (Trevor, 27 Nov 2026)
// ============================================================
async function toggleArchive() {
  const to = !client.is_archived;
  if (to && !confirm('Archive this contact? They are hidden from lists and pickers, but stay on their old jobs. You can unarchive any time.')) return;
  try {
    await dbUpdate('clients', `id=eq.${clientId}`, { is_archived: to });
    client.is_archived = to;
    showToast(to ? 'Archived' : 'Unarchived');
    renderView();
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

async function linkCount() {
  return await supabaseRequest('rpc/client_link_count', { method: 'POST', body: JSON.stringify({ p_id: clientId }) });
}

async function deleteClient() {
  try {
    const n = await linkCount();
    if (n > 0) {
      if (confirm(`This contact is linked to ${n} job${n !== 1 ? 's' : ''}, enquir${n !== 1 ? 'ies' : 'y'} or contacts, so it can't simply be deleted.\n\nOK = merge it into another contact (their jobs move across).\nCancel = leave it. You can Archive it instead to hide it.`)) openMerge();
      return;
    }
    if (!confirm(`Delete ${client.company_name || client.full_name || 'this contact'} for good? This cannot be undone.`)) return;
    await dbDelete('clients', `id=eq.${clientId}`);
    showToast('Contact deleted');
    setTimeout(() => { window.location.href = 'clients.html'; }, 600);
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

async function openMerge() {
  let all = [];
  try { all = (await dbGet('clients', { select: 'id,client_type,full_name,company_name,email', limit: '5000' })) || []; }
  catch (e) { showToast('Error: ' + e.message, 'error'); return; }
  all = all.filter(c => c.id !== clientId);
  const ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'mergeModal'; ov.style.display = 'flex';
  ov.innerHTML = `<div class="modal" style="max-width:520px;">
    <div class="modal-title">Merge into another contact</div>
    <div class="modal-sub">All of <b>${escapeHtml(client.company_name || client.full_name || 'this contact')}</b>'s jobs, enquiries and people move to the contact you pick, then this one is deleted. Their email is kept as an extra email on the other contact.</div>
    <input class="form-control" id="mgQ" placeholder="Search name, company or email" autocomplete="off">
    <div id="mgR" style="max-height:260px;overflow-y:auto;margin-top:8px;"></div>
    <div class="modal-footer"><button class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="document.getElementById('mergeModal').remove()">Cancel</button></div>
  </div>`;
  document.body.appendChild(ov);
  const q = document.getElementById('mgQ'), r = document.getElementById('mgR');
  q.oninput = () => {
    const t = q.value.trim().toLowerCase();
    const hits = t.length < 2 ? [] : all.filter(c => [c.full_name, c.company_name, c.email].some(v => (v || '').toLowerCase().includes(t))).slice(0, 10);
    r.innerHTML = hits.map(c => `<div class="mg-hit" data-id="${c.id}" style="padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px;">
      <b>${escapeHtml(introducerLabel(c))}</b><div class="muted">${escapeHtml(c.email || '')}</div></div>`).join('');
    r.querySelectorAll('.mg-hit').forEach(d => d.onclick = () => doMerge(all.find(c => c.id === d.dataset.id)));
  };
  q.focus();
}

async function doMerge(into) {
  if (!confirm(`Merge ${client.company_name || client.full_name || 'this contact'} into ${introducerLabel(into)}? This cannot be undone.`)) return;
  try {
    await supabaseRequest('rpc/merge_client', { method: 'POST', body: JSON.stringify({ p_from: clientId, p_into: into.id }) });
    showToast('Merged');
    setTimeout(() => { window.location.href = `client-detail.html?id=${into.id}`; }, 600);
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

init();
</script>
</body>
</html>
